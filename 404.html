<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0c0b09;
        color: #f6f1e8;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      main { padding: 32px 20px; max-width: 28rem; }
      h1 {
        margin: 0 0 12px;
        font-family: "Nouvelle Grotesquerie", "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-synthesis: none;
        font-size: clamp(3rem, 8vw, 4.5rem);
        line-height: 0.96;
      }
      p { margin: 0 0 12px; color: #b7aea3; line-height: 1.5; }
      a { color: #f6f1e8; }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found.</h1>
      <p>That address doesn't match anything here.</p>
      <p><a id="home" href="/">Back home</a></p>
    </main>
    <script>
      var next = location.pathname.replace(/\/[^/]*$/, "/");
      if (!next) next = "/";
      document.getElementById("home").href = next;
      var face = document.createElement("style");
      face.textContent = "@font-face{font-family:'Nouvelle Grotesquerie';src:url('" + next + "assets/fonts/NouvelleGrotesquerie.otf') format('opentype');font-weight:400;font-style:normal;font-display:swap}";
      document.head.appendChild(face);
    </script>
  </body>
</html>
